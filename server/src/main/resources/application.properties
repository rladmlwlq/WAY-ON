# 공통 설정
spring.application.name=wayon-server

# 프로필 그룹: 앱 설정 + DB 설정
spring.profiles.default=local
spring.profiles.group.local=db-local
spring.profiles.group.dev=db-dev

# 외부 API 키는 server/.env에서 읽습니다 (git 제외, team-setup.md 4-5). 없으면 건너뜀
spring.config.import=optional:file:.env[.properties]

# 시간은 모두 UTC (DB, JSON 동일)
spring.jackson.time-zone=UTC

# 스키마는 db/schema.sql을 직접 적용합니다. 서버 시작 때 자동 실행하지 않습니다.
spring.sql.init.mode=never

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
